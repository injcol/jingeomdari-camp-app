<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-label="실사진 준비 중">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ece1cb"/>
      <stop offset="1" stop-color="#dac9a8"/>
    </linearGradient>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="860" height="560" fill="url(#bg)"/>
  <rect width="860" height="560" filter="url(#n)" opacity="0.05"/>
  <!-- 강물 S커브 -->
  <path d="M -20 400 C 200 360 220 470 430 430 C 640 390 660 480 880 440" fill="none" stroke="#4f9aa0" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
  <path d="M -20 400 C 200 360 220 470 430 430 C 640 390 660 480 880 440" fill="none" stroke="#175055" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity="0.6"/>
  <!-- 징검다리 돌 3 -->
  <ellipse cx="250" cy="402" rx="46" ry="30" fill="#a39a8b" opacity="0.85"/>
  <ellipse cx="430" cy="430" rx="50" ry="32" fill="#736a5d" opacity="0.9"/>
  <ellipse cx="610" cy="408" rx="44" ry="29" fill="#a39a8b" opacity="0.85"/>
  <!-- 카메라 글리프 -->
  <g transform="translate(430 215)" fill="none" stroke="#175055" stroke-width="7" stroke-linejoin="round" opacity="0.78">
    <rect x="-72" y="-44" width="144" height="100" rx="16"/>
    <path d="M -40 -44 l 14 -22 l 52 0 l 14 22" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="30"/>
    <circle cx="0" cy="8" r="2.5" fill="#175055"/>
  </g>
  <text x="430" y="320" text-anchor="middle" font-family="'Nanum Myeongjo','AppleMyungjo','Noto Serif KR',serif" font-size="34" font-weight="800" fill="#473d33">실사진 준비 중</text>
  <text x="430" y="356" text-anchor="middle" font-family="'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif" font-size="19" fill="#736a5d">캠프 사전답사 때 우리가 찍은 사진으로 채워져요</text>
</svg>
